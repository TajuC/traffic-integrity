<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a quote</title>
  <link rel="stylesheet" href="/site.css">
  <script src="/_ti/beacon.js" defer></script>
  <script src="/_ti/forms.js" defer></script>
  <script src="/site.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="intro">
      <h1>Request a free quote</h1>
      <p>Tell us what you need and we will get back to you within one business day.</p>
    </section>

    <form id="quote-form" class="lead-form" action="/api/leads" method="post" data-form-id="quote" novalidate>
      <label>Full name
        <input name="name" autocomplete="name" required maxlength="120">
      </label>
      <label>Email
        <input name="email" type="email" autocomplete="email" maxlength="254">
      </label>
      <label>Phone
        <input name="phone" type="tel" autocomplete="tel" maxlength="32">
      </label>
      <label>How can we help?
        <textarea name="message" rows="5" maxlength="4000"></textarea>
      </label>
      <div data-challenge class="challenge" hidden></div>
      <button type="submit">Send request</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
